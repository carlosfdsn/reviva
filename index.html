<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3d4a3e" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica o tema antes da primeira pintura (evita flash branco no modo escuro).
      try {
        var t = localStorage.getItem("reviva-theme");
        if (t) t = JSON.parse(t);
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#121713" : "#3d4a3e");
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="REVIVA — transforme descarte em novos começos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%233d4a3e%27/%3E%3Ctext x=%2716%27 y=%2722.500%27 font-family=%27Georgia,serif%27 font-size=%2719%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3ER%3C/text%3E%3C/svg%3E" />
    <title>REVIVA — Reciclagem Circular</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
